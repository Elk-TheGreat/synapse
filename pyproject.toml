[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-vpe"
version = "1.0.0"
description = "SYNAPSE — a universal visual programming environment with a graph-native execution engine"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SYNAPSE contributors" }]
requires-python = ">=3.11"
keywords = ["visual-programming", "dataflow", "graph", "pyside6", "ide"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "PySide6-Essentials>=6.6",
  "Pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
synapse = "synapse.application.app:main"

[project.urls]
Documentation = "https://github.com/Elk-TheGreat/synapse#readme"
Source = "https://github.com/Elk-TheGreat/synapse"

[tool.hatch.build.targets.wheel]
packages = ["synapse"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
